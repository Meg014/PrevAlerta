name: Verificar aplicação
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  phase-one:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcm_test
          POSTGRES_DB: test_prev_alerta
          # Disposable CI database only; production uses password authentication.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pcm_test -d test_prev_alerta"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_TEST_URL: postgres://pcm_test@127.0.0.1:5432/test_prev_alerta?encoding=utf8&quoteIdentifiers=true
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, pdo_pgsql, pgsql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: npm ci
      - run: npm run build
